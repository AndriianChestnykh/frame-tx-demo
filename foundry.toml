[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64

[fmt]
line_length = 100
# Standard EVM compilation only. This does not enable native EIP-8141 opcodes.
